<style>

              background-image: linear-gradient(to right, rgba(62, 72, 80, 0.1) 1px, transparent 1px),

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-lg relative overflow-hidden selection:bg-primary selection:text-on-primary">
<!-- Subtle Grid Background -->
<div class="absolute inset-0 bg-grid-pattern pointer-events-none"></div>
<!-- Radial gradient for center focus -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,#0f1418_70%)] pointer-events-none"></div>
<main class="relative z-10 w-full max-w-2xl flex flex-col items-center">
<!-- Header -->
<div class="mb-xl text-center">
<h1 class="font-display-score text-display-score text-error uppercase tracking-widest neon-glow-error mb-sm">
                Game Over
            </h1>
<p class="font-label-mono text-label-mono text-on-surface-variant uppercase">
                Grid sequence terminated
            </p>
</div>
<!-- Stats Bento Grid -->
<div class="grid grid-cols-2 gap-md w-full mb-xl">
<!-- Final Score Main Card -->
<div class="col-span-2 bg-surface-container border border-outline-variant p-xl flex flex-col items-center justify-center relative group">
<div class="absolute top-0 left-0 w-full h-[2px] bg-primary opacity-50 shadow-[0_0_8px_rgba(137,206,255,0.8)]"></div>
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-[0.2em] mb-sm">Final Score</span>
<span class="font-display-score text-[64px] leading-none text-primary tracking-tighter">
                    284,500
                </span>
</div>
<!-- Max Level Card -->
<div class="bg-surface-container border border-outline-variant p-lg flex flex-col items-center justify-center group hover:bg-surface-bright transition-colors duration-300">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-sm">Max Level</span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-lg text-headline-lg text-on-surface">18</span>
</div>
</div>
<!-- Lines Cleared Card -->
<div class="bg-surface-container border border-outline-variant p-lg flex flex-col items-center justify-center group hover:bg-surface-bright transition-colors duration-300">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-sm">Lines Cleared</span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-lg text-headline-lg text-on-surface">142</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-md w-full">
<button class="flex-1 bg-primary/10 border border-primary text-primary px-lg py-md font-label-mono text-label-mono uppercase tracking-wider hover:bg-primary hover:text-on-primary transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background flex items-center justify-center gap-sm group relative overflow-hidden">
<span class="absolute inset-0 bg-primary/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></span>
<span class="material-symbols-outlined text-[20px] relative z-10 group-hover:rotate-180 transition-transform duration-500">replay</span>
<span class="relative z-10">Play Again</span>
</button>
<div class="flex gap-md flex-1">
<button class="flex-1 bg-surface border border-outline-variant text-on-surface px-sm py-md font-label-mono text-label-mono uppercase tracking-wider hover:bg-surface-bright hover:border-outline transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-outline focus:ring-offset-2 focus:ring-offset-background flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[18px]">share</span>
<span class="hidden sm:inline">Share</span>
</button>
<button class="flex-1 bg-surface border border-outline-variant text-on-surface px-sm py-md font-label-mono text-label-mono uppercase tracking-wider hover:bg-surface-bright hover:border-outline transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-outline focus:ring-offset-2 focus:ring-offset-background flex items-center justify-center gap-sm">
