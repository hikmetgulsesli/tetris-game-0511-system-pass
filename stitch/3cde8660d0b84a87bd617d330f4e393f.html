<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Simulated Game Background (Blurred Playfield Context) -->
<div class="absolute inset-0 flex items-center justify-center p-md opacity-50">
<div class="flex gap-lg">
<!-- Hold Panel Mock -->
<div class="hidden md:flex flex-col w-32 h-32 border border-outline-variant bg-surface-dim p-sm items-center justify-center">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase">Hold</span>
<div class="w-16 h-16 bg-outline-variant/20 mt-sm"></div>
</div>
<!-- Main Playfield Mock -->
<div class="w-[320px] h-[640px] bg-surface-dim border border-outline-variant relative overflow-hidden" style="background-image: linear-gradient(to right, #3e4850 1px, transparent 1px), linear-gradient(to bottom, #3e4850 1px, transparent 1px); background-size: 32px 32px; background-position: -1px -1px;">
<!-- Simulated blocks -->
<div class="absolute bottom-0 left-0 w-[64px] h-[32px] bg-primary/40 border border-primary"></div>
<div class="absolute bottom-[32px] left-[32px] w-[96px] h-[32px] bg-tertiary/40 border border-tertiary"></div>
<div class="absolute top-[320px] left-[128px] w-[64px] h-[64px] bg-secondary-fixed/40 border border-secondary-fixed"></div>
</div>
<!-- Next Panel Mock -->
<div class="hidden md:flex flex-col w-32 h-64 border border-outline-variant bg-surface-dim p-sm items-center justify-start gap-md">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase">Next</span>
<div class="w-16 h-16 bg-outline-variant/30"></div>
<div class="w-16 h-16 bg-outline-variant/20"></div>
<div class="w-16 h-16 bg-outline-variant/10"></div>
</div>
</div>
</div>
<!-- Pause Overlay (The Active Task) -->
<div class="absolute inset-0 z-50 bg-background/85 backdrop-blur-md flex items-center justify-center p-md">
<!-- Pause Menu Card -->
<div class="bg-surface border border-outline-variant flex flex-col items-center justify-center p-xl w-full max-w-[360px] relative overflow-hidden">
<!-- Decorative Tech Accents -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-primary/50 m-2"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-primary/50 m-2"></div>
<!-- Title -->
<h1 class="font-headline-lg text-headline-lg text-primary tracking-widest uppercase mb-xl flex flex-col items-center gap-xs" style="text-shadow: 0 0 16px rgba(137, 206, 255, 0.4);">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">pause_circle</span>
                Paused
            </h1>
<!-- Action Buttons Navigation Area -->
<nav aria-label="Pause Menu" class="w-full flex flex-col gap-md">
<!-- Resume Action -->
<button class="w-full h-touch-target-min flex items-center justify-center gap-sm border border-primary bg-transparent text-primary hover:bg-primary hover:text-on-primary transition-all duration-200 font-label-mono text-label-mono uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined">play_arrow</span>
                    Resume
                </button>
<!-- Restart Action -->
<button class="w-full h-touch-target-min flex items-center justify-center gap-sm border border-outline-variant bg-transparent text-on-surface hover:bg-on-surface hover:text-surface transition-all duration-200 font-label-mono text-label-mono uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-on-surface focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined">replay</span>
                    Restart
                </button>
<!-- Settings Action -->
<button class="w-full h-touch-target-min flex items-center justify-center gap-sm border border-outline-variant bg-transparent text-on-surface hover:bg-on-surface hover:text-surface transition-all duration-200 font-label-mono text-label-mono uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-on-surface focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined">settings</span>
                    Settings
                </button>
<!-- Divider -->
<div class="w-full h-px bg-outline-variant my-sm"></div>
<!-- Main Menu Action -->
<button class="w-full h-touch-target-min flex items-center justify-center gap-sm border border-outline-variant bg-transparent text-on-surface-variant hover:border-error hover:text-error hover:bg-error/10 transition-all duration-200 font-label-mono text-label-mono uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-surface">
<span class="material-symbols-outlined">logout</span>
                    Main Menu
                </button>
</nav>
