<span class="relative z-10 flex items-center gap-sm">
<span class="material-symbols-outlined text-[18px]">play_arrow</span>

                    </span>
<!-- Hover Glow Effect -->
<div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300" style="box-shadow: inset 0 0 15px rgba(137, 206, 255, 0.5);"></div>
</button>

<span class="material-symbols-outlined text-[18px]">resume</span>
